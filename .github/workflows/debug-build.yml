name: Debug Build

on:
  workflow_dispatch:  # 手动触发
    inputs:
      platform:
        type: choice
        description: '选择测试平台'
        required: true
        default: 'ubuntu-22.04'
        options:
          - ubuntu-22.04
          - macos-latest
          - windows-latest

jobs:
  debug-build:
    # 当选 macos-latest 时，实际跑在 x86_64 硬件上
    runs-on: ${{ inputs.platform == 'macos-latest' && 'macos-latest-large' || inputs.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Ubuntu dependencies
        if: inputs.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            libasound2-dev \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev
          
          # 验证安装的包
          dpkg -l | grep -E 'webkit|appindicator|rsvg|udev|asound|gtk'

      # 添加环境变量配置
      - name: Set up environment variables
        run: echo "${{ secrets.ENV_LOCAL_CONTENT }}" > .env.local

      # 安装 pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      # 设置 Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Vite + Tauri
        run: pnpm build

      # （可选）在 ARM 机器上安装 Rosetta
      # - name: Install Rosetta 2
      #   if: runner.os == 'macOS' && runner.arch == 'ARM'
      #   run: softwareupdate --install-rosetta --agree-to-license

      # 安装 Rust 并添加 x86_64 目标
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Add x86_64 Rust target
        run: rustup target add x86_64-apple-darwin
      
      # Rust 缓存
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 构建并打包 Tauri x86_64 应用
      # - name: Build Tauri app
      #   uses: tauri-apps/tauri-action@v0
      - name: Build macOS x86_64 Tauri App
        if: inputs.platform == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          pnpm tauri build --target x86_64-apple-darwin

        # env:
        #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        #   TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # with:
        #   args: "--target x86_64-apple-darwin"
        #   releaseId: "debug-build"

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ inputs.platform }}-build
          path: src-tauri/target/release/bundle/*
          retention-days: 3